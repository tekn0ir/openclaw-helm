apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-llamacpp
  labels:
    app: openclaw-llamacpp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openclaw-llamacpp
  template:
    metadata:
      labels:
        app: openclaw-llamacpp
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        {{- toYaml $.Values.nodeSelector | nindent 8 }}
      containers:
        - name: llamacpp
          image: "{{ .Values.llamacpp.image }}:{{ .Values.llamacpp.tag }}"
          imagePullPolicy: {{ .Values.llamacpp.pullPolicy }}
          # GLM-4.6 (357B MoE, "massive GLM") served as a quantized GGUF and split
          # across CPU + both GPUs:
          #   * Dense/attention/shared-expert tensors are offloaded to the two 16GB
          #     GPUs (-ngl 99, split evenly with --tensor-split).
          #   * The huge routed MoE expert tensors stay in system RAM (-ot ...=CPU),
          #     which is what makes a 357B model fit on 32GB VRAM + 128GB RAM.
          #   * 256K context is enabled with --ctx-size 262144, flash attention and a
          #     q8_0-quantized KV cache to keep the cache within the 128GB RAM budget.
          command:
            - /app/llama-server
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --hf-repo
            - "{{ .Values.llamacpp.hfRepo }}:{{ .Values.llamacpp.quant }}"
            - --alias
            - "{{ .Values.models.id }}"
            - --ctx-size
            - "{{ .Values.llamacpp.contextSize }}"
            - --n-gpu-layers
            - "99"
            - --tensor-split
            - "{{ .Values.llamacpp.tensorSplit }}"
            - --override-tensor
            - "{{ .Values.llamacpp.cpuMoeRegex }}=CPU"
            - --flash-attn
            - "on"
            - --cache-type-k
            - "{{ .Values.llamacpp.cacheType }}"
            - --cache-type-v
            - "{{ .Values.llamacpp.cacheType }}"
            - --threads
            - "{{ .Values.llamacpp.threads }}"
            - --jinja
            - --temp
            - "1.0"
            - --top-p
            - "0.95"
            - --min-p
            - "0.01"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Persist the downloaded GGUF so it is fetched only once.
            - name: LLAMA_CACHE
              value: /models
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "1"
          resources:
            requests:
              memory: 32Gi
              cpu: "6"
            limits:
              memory: 128Gi
              cpu: "12"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            # The model download + load can take a long time on first start.
            failureThreshold: 120
          volumeMounts:
            - name: llamacpp-models
              mountPath: /models
      volumes:
        - name: llamacpp-models
          hostPath:
            path: /opt/teknoir/openclaw/llamacpp
            type: DirectoryOrCreate
