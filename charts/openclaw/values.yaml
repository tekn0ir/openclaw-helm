# Image configuration
image:
  repository: tekn0ir/openclaw
  tag: latest
  pullPolicy: Always

# MCP Servers configuration
mcp:
  swedishLaw:
    image: tekn0ir/swedish-law-mcp
    tag: latest
    pullPolicy: Always

# GPU node placement (empty selects any node)
nodeSelector: {}

# Open Notebook (NotebookLM alternative) configuration
# Single-container image that bundles the frontend, API and SurrealDB. It talks to
# the local vLLM server through its OpenAI-compatible API (see vllm below),
# so no external API keys are required.
openNotebook:
  image: lfnovo/open_notebook
  # The "-single" tag bundles SurrealDB in the same container.
  tag: v1-latest-single
  pullPolicy: Always
  # Public HTTPS route served by Istio/Keycloak. Open Notebook uses API_URL in
  # the browser runtime config; setting it explicitly avoids falling back to
  # localhost:5055 when the UI is accessed through a reverse proxy.
  publicUrl: "https://open-notebook-rtx2000-ada-128gb-se-teknoir-demo.teknoir.cloud"
  # Restrict browser API access to the public route instead of Open Notebook's
  # development default of allowing every origin.
  corsOrigins:
    - "https://open-notebook-rtx2000-ada-128gb-se-teknoir-demo.teknoir.cloud"
  # Required by Open Notebook when storing provider credentials via the Settings
  # UI. Override this value before exposing the service beyond this demo cluster.
  encryptionKey: "open-notebook-demo-change-me"
  # Fixed NodePort for the web UI, derived from the default UI port 8502.
  nodePort: 30502

# Model configuration
# Served by a local vLLM server (OpenAI-compatible API), see vllm below.
models:
  primary: "vllm/deepseek-v4-flash"
  id: "deepseek-v4-flash"
  # A 285B MoE with CPU-offloaded weights is slow, especially for the first
  # (prompt-processing) token. Give the provider and the agent run a very
  # generous idle/run timeout so long generations are not cut off with
  # "LLM request timed out".
  # Provider-level idle timeout (seconds) between streamed tokens.
  providerTimeoutSeconds: 3600
  # Agent-run ceiling (seconds); must be >= the provider timeout to take effect.
  agentTimeoutSeconds: 14400
  # Stuck-session watchdog thresholds (milliseconds). The slow 256K prompt-processing
  # can go minutes without streaming a token; OpenClaw's watchdog otherwise classifies
  # the run as "stalled" and abort-drains it (abort_embedded_run) even though the model
  # is still working. Raise the abort window past the agent-run ceiling so long, slow
  # generations are not killed; keep the warn threshold lower for visibility only.
  # No-progress age (ms) before a session is merely logged as long-running/stalled.
  stuckSessionWarnMs: 600000
  # No-progress age (ms) before an in-flight run may be abort-drained for recovery.
  stuckSessionAbortMs: 14400000
  # Session transcript write-lock watchdog release threshold (ms). A single slow model
  # call holds the transcript lock; the default 300000ms max-hold releases it mid-run.
  sessionWriteLockMaxHoldMs: 14400000

# vLLM server configuration
# Runs DeepSeek-V4-Flash (285B MoE, ~13B active) with vLLM's native DeepSeek V4
# support. The model ships in a mixed native format (FP4 MoE experts + FP8 dense
# layers) that the Blackwell RTX 2000 Pro GPUs accelerate in hardware (NVFP4).
vllm:
  # Official vLLM OpenAI-compatible server image.
  image: vllm/vllm-openai
  tag: latest
  pullPolicy: IfNotPresent
  # Hugging Face checkpoint auto-downloaded and served by vLLM.
  model: "deepseek-ai/DeepSeek-V4-Flash"
  # Shard the model across the two 16GB Blackwell GPUs.
  tensorParallelSize: 2
  # --cpu-offload-gb is applied PER GPU, so the total host RAM reserved is
  # tensorParallelSize x cpuOffloadGb. With tensorParallelSize: 2 this must stay
  # well under the 128GB host / 128Gi container limit, leaving room for the OS,
  # the page cache for the model files and the RAM-resident KV cache/activations.
  # 45 => 90GB total, which fits with headroom.
  cpuOffloadGb: 45
  # Context window (tokens). DeepSeek V4 supports up to 1M; 128K is a practical
  # size given the VRAM/KV-cache budget on two 16GB cards.
  maxModelLen: 131072
  # Concurrent sequences kept small to bound KV-cache memory on 32GB VRAM.
  maxNumSeqs: 8
  # Fraction of each GPU's memory vLLM may allocate.
  gpuMemoryUtilization: 0.92
  # FP8 KV cache keeps the long-context cache within the VRAM budget.
  kvCacheDtype: "fp8"
  # DeepSeek V4 requires its model-specific tokenizer, tool and reasoning parsers.
  tokenizerMode: "auto"
  toolCallParser: "deepseek_v4"
  reasoningParser: "deepseek_v4"
  # Optional Hugging Face token. Authenticated requests get higher Hub rate
  # limits and faster downloads. Leave empty for anonymous access.
  hfToken: ""
